[API_KEYS]
OPENAI_API_KEY = ""
# Scegli una delle API per le immagini e inserisci la chiave corrispondente
UNSPLASH_ACCESS_KEY = "LA_TUA_CHIAVE_API_UNSPLASH"
# PEXELS_API_KEY = "LA_TUA_CHIAVE_API_PEXELS"
# Per TTS Cloud (opzionale)
GOOGLE_APPLICATION_CREDENTIALS = "google-data.json"
# AWS_ACCESS_KEY_ID = "LA_TUA_CHIAVE_ACCESSO_AWS"
# AWS_SECRET_ACCESS_KEY = "LA_TUA_CHIAVE_SEGRETA_AWS"
# AWS_REGION_NAME = "la_tua_regione_aws"

[SETTINGS]
NEWS_SOURCE_URL = ""
NUM_IMAGES = 10
VIDEO_RESOLUTION = "720p" 
TTS_PROVIDER = google 
OUTPUT_DIR = "output-final"
TEMP_DIR = "temp"
LOG_LEVEL = "DEBUG" 
CHECK_INTERVAL_SECONDS = 60 # Secondi di attesa tra un controllo e l'altro

[AI_PROCESSOR]
MODEL = "gpt-3.5-turbo"
SUMMARY_TARGET_WORDS = 1000
NUM_KEYWORDS = 7

[IMAGE_FINDER]
API_PROVIDER = duckduckgo

[VIDEO_ASSEMBLER]
IMAGE_DURATION_MODE = "auto" 
TRANSITION_TYPE = "fade" 
TRANSITION_DURATION = 0.5 

[PYTTSX3_SETTINGS]
# VOICE_ID = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Speech\\Voices\\Tokens\\TTS_MS_EN-US_ZIRA_11.0" # Esempio Windows EN
# VOICE_ID = "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Speech\\Voices\\Tokens\\TTS_MS_IT-IT_ELSA_11.0" # Esempio Windows IT Elsa
VOICE_ID = "com.apple.speech.synthesis.voice.alice" 
# VOICE_GENDER = "male" # Opzioni: male, female
RATE = 180 

[GOOGLE_TTS_SETTINGS]
LANGUAGE_CODE = "it-IT"
# VOICE_NAME = "it-IT-Wavenet-A" # Esempio voce WaveNet (più naturale, potenzialmente più costosa)
VOICE_NAME = "it-IT-Standard-D"
# SSML_GENDER = "NEUTRAL" # Opzioni: MALE, FEMALE, NEUTRAL (se vuoi specificarlo)

[VOSK_SETTINGS]
# Percorso alla cartella del modello Vosk italiano scaricato
MODEL_PATH = models/vosk-model-small-it-0.22

# --- NUOVA SEZIONE PER INTRO/OUTRO --- #
[VIDEO_EXTRAS]
INTRO_VIDEO_PATH = "intro/intro.mp4"
OUTRO_VIDEO_PATH = "outro/outro.mp4"

# --- NUOVA SEZIONE PER THUMBNAIL --- #
[THUMBNAIL]
ENABLED = true
OVERLAY_PATH = "thumbnail_generator/overlay.png"
FONT_PATH = "thumbnail_generator/Gotham-Medium.otf"
FONT_SIZE = 80 
TEXT_COLOR = "255, 255, 255"
TEXT_POSITION = "40, 570" 
BOLD_TEXT = true
BACKGROUND_IMAGE_INDEX = 0
OUTPUT_SUFFIX = "_thumbnail.png" 

# --- NUOVA SEZIONE PER UPLOAD YOUTUBE --- #
[YOUTUBE_UPLOAD]
ENABLED = true 
CLIENT_SECRETS_JSON = "client_secret.json"
CREDENTIALS_JSON = "token.json"
PRIVACY_STATUS = "public" 
CATEGORY_ID = "25" 

[YOUTUBE]
CLIENT_SECRETS_FILE = "client_secrets.json"
CREDENTIALS_FILE = "youtube_credentials.json"
VIDEO_CATEGORY_ID = 25
VIDEO_PRIVACY_STATUS = "public" # o public, unlisted
DAILY_UPLOAD_LIMIT = 6

